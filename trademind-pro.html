<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>TradeMind Pro | Smart Money Trading Platform</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['Outfit', 'sans-serif'],
                        'mono': ['Space Mono', 'monospace'],
                        'code': ['JetBrains Mono', 'monospace']
                    },
                    colors: {
                        'neon': {
                            cyan: '#00ffff',
                            green: '#00ff88',
                            pink: '#ff0080',
                            blue: '#0066ff'
                        }
                    }
                }
            }
        }
    </script>
    
    <!-- Chart.js for Analytics -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Firebase SDK -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, signOut, onAuthStateChanged, createUserWithEmailAndPassword, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, getDoc, updateDoc, collection, addDoc, getDocs, query, where, orderBy, limit, serverTimestamp, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyDPMUlI0gErxXHjTrb7kzqvmGXL7hYF2CM",
            authDomain: "trademind-ac88f.firebaseapp.com",
            projectId: "trademind-ac88f",
            storageBucket: "trademind-ac88f.firebasestorage.app",
            messagingSenderId: "912504780824",
            appId: "1:912504780824:web:b764ff15e861f095bc2b6d",
            measurementId: "G-JB8GWCZHFC"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const googleProvider = new GoogleAuthProvider();
        
        window.db = db;
        window.auth = auth;
        
        // Auth Functions
        window.signInWithGoogle = async () => {
            try {
                await signInWithPopup(auth, googleProvider);
            } catch(e) {
                showToast('Login failed: ' + e.message, 'error');
            }
        };
        
        window.signUpEmail = async () => {
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            if(!email || !password || password.length < 6) {
                showToast('Email aur password (min 6 chars) dalo', 'error');
                return;
            }
            try {
                await createUserWithEmailAndPassword(auth, email, password);
                showToast('Account ban gaya! Welcome trader 🚀', 'success');
            } catch(err) {
                showToast(err.message, 'error');
            }
        };
        
        window.loginEmail = async () => {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            try {
                await signInWithEmailAndPassword(auth, email, password);
            } catch(err) {
                showToast('Wrong credentials bro', 'error');
            }
        };
        
        window.logout = async () => {
            await signOut(auth);
            location.reload();
        };
        
        // Auth State Observer
        onAuthStateChanged(auth, async (user) => {
            if(user) {
                document.getElementById('authContainer').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('userNameSpan').innerText = user.displayName || user.email.split('@')[0];
                await ensureUserDoc(user.uid);
                loadAllUserData(user.uid);
            } else {
                document.getElementById('authContainer').classList.remove('hidden');
                document.getElementById('appContainer').classList.add('hidden');
            }
        });
        
        async function ensureUserDoc(uid) {
            const ref = doc(db, "users", uid);
            const snap = await getDoc(ref);
            if(!snap.exists()) {
                await setDoc(ref, {
                    email: auth.currentUser.email,
                    displayName: auth.currentUser.displayName || "Trader",
                    createdAt: serverTimestamp(),
                    stats: {
                        discipline: 70,
                        riskControl: 70,
                        winRate: 0,
                        totalPnL: 0,
                        totalTrades: 0,
                        completedDays: 0
                    },
                    settings: {
                        riskPercent: 2,
                        theme: "dark",
                        notifications: true
                    },
                    badges: [],
                    level: "Beginner"
                });
            }
        }
        
        window.loadAllUserData = async (uid) => {
            try {
                // Load trades
                const tradesSnap = await getDocs(query(collection(db, "trades"), where("userId", "==", uid), orderBy("date", "desc"), limit(100)));
                let trades = [];
                tradesSnap.forEach(d => trades.push({ id: d.id, ...d.data() }));
                localStorage.setItem('tm_trades', JSON.stringify(trades));
                
                // Load progress
                const progSnap = await getDocs(collection(db, "users", uid, "progress"));
                let prog = Array(30).fill(false);
                progSnap.forEach(d => {
                    let num = parseInt(d.id.split('_')[1]);
                    if(num > 0 && num <= 30) prog[num-1] = d.data().completed;
                });
                localStorage.setItem('tm_progress', JSON.stringify(prog));
                
                // Load user stats
                const userDoc = await getDoc(doc(db, "users", uid));
                if(userDoc.exists()) {
                    localStorage.setItem('tm_userStats', JSON.stringify(userDoc.data().stats || {}));
                }
                
                window.dispatchEvent(new Event('dataLoaded'));
            } catch(e) {
                console.error('Data load error:', e);
            }
        };
        
        window.addTrade = async (trade) => {
            const user = auth.currentUser;
            if(!user) return;
            try {
                await addDoc(collection(db, "trades"), {
                    ...trade,
                    userId: user.uid,
                    createdAt: serverTimestamp(),
                    date: trade.date || new Date().toISOString().slice(0,10)
                });
                await updateUserStats();
                showToast('Trade journal me add ho gaya! 📓', 'success');
            } catch(e) {
                showToast('Error: ' + e.message, 'error');
            }
        };
        
        window.updateProgress = async (dayIdx, completed) => {
            const user = auth.currentUser;
            if(!user) return;
            try {
                await setDoc(doc(db, "users", user.uid, "progress", `day_${dayIdx+1}`), {
                    completed,
                    updatedAt: serverTimestamp()
                }, { merge: true });
                
                // Update completed days count
                const progSnap = await getDocs(collection(db, "users", user.uid, "progress"));
                let completedCount = 0;
                progSnap.forEach(d => { if(d.data().completed) completedCount++; });
                await updateDoc(doc(db, "users", user.uid), {
                    "stats.completedDays": completedCount,
                    "stats.discipline": 70 + Math.floor(completedCount / 3)
                });
            } catch(e) {
                console.error('Progress update error:', e);
            }
        };
        
        async function updateUserStats() {
            const user = auth.currentUser;
            if(!user) return;
            try {
                const tradesSnap = await getDocs(query(collection(db, "trades"), where("userId", "==", user.uid)));
                let totalPnL = 0, wins = 0, totalRisk = 0;
                tradesSnap.forEach(d => {
                    let p = d.data().pnl || 0;
                    totalPnL += p;
                    if(p > 0) wins++;
                    totalRisk += Math.abs(p);
                });
                const winRate = tradesSnap.size ? (wins/tradesSnap.size)*100 : 0;
                const riskControl = 65 + Math.min(tradesSnap.size * 2, 30);
                
                await updateDoc(doc(db, "users", user.uid), {
                    "stats.totalPnL": totalPnL,
                    "stats.totalTrades": tradesSnap.size,
                    "stats.winRate": winRate,
                    "stats.riskControl": riskControl
                });
            } catch(e) {
                console.error('Stats update error:', e);
            }
        }
        
        window.deleteTrade = async (tradeId) => {
            if(!confirm('Trade delete karna chahte ho?')) return;
            try {
                await deleteDoc(doc(db, "trades", tradeId));
                await updateUserStats();
                showToast('Trade deleted', 'success');
                window.dispatchEvent(new Event('dataLoaded'));
            } catch(e) {
                showToast('Delete failed', 'error');
            }
        };
        
        // Toast notification system
        window.showToast = (message, type = 'info') => {
            const toast = document.createElement('div');
            toast.className = `fixed top-4 right-4 z-[9999] px-6 py-3 rounded-2xl font-display text-sm font-medium shadow-2xl transform transition-all duration-300 ${
                type === 'success' ? 'bg-green-500/20 border border-green-500/50 text-green-400' :
                type === 'error' ? 'bg-red-500/20 border border-red-500/50 text-red-400' :
                'bg-cyan-500/20 border border-cyan-500/50 text-cyan-400'
            }`;
            toast.style.animation = 'slideInRight 0.3s ease-out';
            toast.innerHTML = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.style.animation = 'slideOutRight 0.3s ease-out';
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        };
    </script>
    
    <style>
        * {
            font-family: 'Outfit', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        :root {
            --bg-primary: #050911;
            --bg-secondary: #0a0e1a;
            --bg-tertiary: #0f1420;
            --card-bg: rgba(15, 20, 32, 0.7);
            --glass-bg: rgba(20, 26, 40, 0.6);
            --border-color: rgba(0, 255, 255, 0.15);
            --text-primary: #ffffff;
            --text-secondary: #a0aec0;
            --neon-cyan: #00ffff;
            --neon-green: #00ff88;
            --neon-pink: #ff0080;
        }
        
        .light {
            --bg-primary: #f5f7fa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #e8ecf1;
            --card-bg: rgba(255, 255, 255, 0.9);
            --glass-bg: rgba(255, 255, 255, 0.7);
            --border-color: rgba(0, 150, 200, 0.2);
            --text-primary: #1a202c;
            --text-secondary: #4a5568;
            --neon-cyan: #00b8d4;
            --neon-green: #00c853;
            --neon-pink: #d81b60;
        }
        
        body {
            background: linear-gradient(135deg, var(--bg-primary) 0%, var(--bg-secondary) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            overflow-x: hidden;
        }
        
        /* Background Effects */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: 
                radial-gradient(circle at 20% 50%, rgba(0, 255, 255, 0.05) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 255, 136, 0.05) 0%, transparent 50%);
            pointer-events: none;
            z-index: 0;
        }
        
        /* Glass Card Effect */
        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
        }
        
        .glass-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
            opacity: 0.3;
        }
        
        .glass-card:hover {
            border-color: rgba(0, 255, 255, 0.3);
            box-shadow: 0 12px 48px rgba(0, 255, 255, 0.1);
            transform: translateY(-2px);
        }
        
        .glass-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        /* Neon Effects */
        .neon-text {
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.5);
            font-weight: 700;
        }
        
        .neon-glow {
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }
        
        /* Buttons */
        .btn-neon {
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-green));
            color: #000;
            font-weight: 600;
            box-shadow: 0 4px 20px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }
        
        .btn-neon::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
            transition: left 0.5s;
        }
        
        .btn-neon:hover::before {
            left: 100%;
        }
        
        .btn-neon:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(0, 255, 255, 0.5);
        }
        
        .btn-neon:active {
            transform: translateY(-1px);
        }
        
        /* Progress Bar */
        .progress-glow {
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-green));
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.5);
            border-radius: 10px;
            transition: width 0.5s ease;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--bg-tertiary);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--neon-cyan);
            border-radius: 10px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--neon-green);
        }
        
        /* Inputs */
        input, select, textarea {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.3s ease;
            font-family: 'Outfit', sans-serif;
        }
        
        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.4);
        }
        
        .light input, .light select, .light textarea {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(0, 0, 0, 0.1);
        }
        
        /* Modal Background */
        .modal-bg {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
        }
        
        /* Navigation Active State */
        .nav-btn.active {
            background: linear-gradient(135deg, rgba(0, 255, 255, 0.1), rgba(0, 255, 136, 0.1));
            border-left: 3px solid var(--neon-cyan);
            color: var(--neon-cyan);
            font-weight: 600;
        }
        
        /* Stats Card Animation */
        .stat-card {
            transition: all 0.3s ease;
        }
        
        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 255, 255, 0.2);
        }
        
        /* Mobile Bottom Nav */
        @media (max-width: 1024px) {
            .mobile-nav {
                position: fixed;
                bottom: 0;
                left: 0;
                right: 0;
                background: var(--card-bg);
                backdrop-filter: blur(20px);
                -webkit-backdrop-filter: blur(20px);
                border-top: 1px solid var(--border-color);
                z-index: 1000;
                padding-bottom: env(safe-area-inset-bottom);
            }
            
            .mobile-nav-item {
                flex: 1;
                display: flex;
                flex-direction: column;
                align-items: center;
                padding: 8px;
                color: var(--text-secondary);
                transition: all 0.3s ease;
            }
            
            .mobile-nav-item.active {
                color: var(--neon-cyan);
            }
            
            .mobile-nav-item svg {
                width: 24px;
                height: 24px;
                margin-bottom: 4px;
            }
        }
        
        /* Animations */
        @keyframes slideInRight {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }
        
        @keyframes slideOutRight {
            from {
                transform: translateX(0);
                opacity: 1;
            }
            to {
                transform: translateX(100%);
                opacity: 0;
            }
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .fade-in {
            animation: fadeIn 0.5s ease-out;
        }
        
        /* Loading Spinner */
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid var(--neon-cyan);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* Trade Journal Entry */
        .trade-entry {
            transition: all 0.3s ease;
            border-left: 3px solid transparent;
        }
        
        .trade-entry:hover {
            border-left-color: var(--neon-cyan);
            background: rgba(0, 255, 255, 0.05);
        }
        
        /* Chart Container */
        .chart-container {
            position: relative;
            height: 400px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 16px;
            overflow: hidden;
        }
        
        /* Responsive Typography */
        @media (max-width: 768px) {
            html {
                font-size: 14px;
            }
        }
        
        /* Premium Badge */
        .premium-badge {
            background: linear-gradient(135deg, #ffd700, #ffed4e);
            color: #000;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        /* Day Progress Grid */
        .day-progress-item {
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .day-progress-item:hover {
            transform: scale(1.1);
        }
        
        .day-progress-item.completed {
            background: var(--neon-green);
            color: #000;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }
        
        .day-progress-item.incomplete {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-secondary);
        }
    </style>
</head>

<script>
    // ==================== STATE MANAGEMENT ====================
    let activeTab = "dashboard";
    let trades = [];
    let dailyProgress = Array(30).fill(false);
    let currentUser = null;
    let userStats = { discipline: 70, riskControl: 70, winRate: 0, totalPnL: 0, totalTrades: 0, completedDays: 0 };
    let tvWidget = null;
    
    // ==================== THEME TOGGLE ====================
    window.toggleTheme = () => {
        document.documentElement.classList.toggle('light');
        const theme = document.documentElement.classList.contains('light') ? 'light' : 'dark';
        localStorage.setItem('theme', theme);
        if(tvWidget) {
            initTradingView();
        }
    };
    
    if(localStorage.getItem('theme') === 'light') {
        document.documentElement.classList.add('light');
    }
    
    // ==================== DATA LOADING ====================
    async function loadData() {
        const user = window.auth.currentUser;
        if(!user) return;
        currentUser = user.uid;
        
        const prog = localStorage.getItem('tm_progress');
        if(prog) dailyProgress = JSON.parse(prog);
        
        const tr = localStorage.getItem('tm_trades');
        if(tr) trades = JSON.parse(tr);
        
        const stats = localStorage.getItem('tm_userStats');
        if(stats) userStats = JSON.parse(stats);
        
        render();
    }
    
    // ==================== RENDER MAIN CONTENT ====================
    function render() {
        const container = document.getElementById('mainContent');
        let html = '';
        
        if(activeTab === 'dashboard') html = dashboardHTML();
        else if(activeTab === 'roadmap') html = roadmapHTML();
        else if(activeTab === 'smc') html = smcHTML();
        else if(activeTab === 'chart') html = chartHTML();
        else if(activeTab === 'journal') html = journalHTML();
        else if(activeTab === 'calculator') html = calculatorHTML();
        else if(activeTab === 'analytics') html = analyticsHTML();
        else if(activeTab === 'psychology') html = psychologyHTML();
        else if(activeTab === 'risk') html = riskHTML();
        else if(activeTab === 'execution') html = executionHTML();
        
        container.innerHTML = html;
        container.classList.add('fade-in');
        
        // Update active nav state
        document.querySelectorAll('.nav-btn, .mobile-nav-item').forEach(btn => {
            if(btn.dataset.tab === activeTab) {
                btn.classList.add('active');
            } else {
                btn.classList.remove('active');
            }
        });
        
        attachEvents();
        
        // Initialize TradingView if on chart tab
        if(activeTab === 'chart') {
            setTimeout(() => initTradingView(), 100);
        }
        
        // Initialize charts if on analytics tab
        if(activeTab === 'analytics') {
            setTimeout(() => initAnalyticsCharts(), 100);
        }
    }
    
    // ==================== DASHBOARD HTML ====================
    function dashboardHTML() {
        const completed = dailyProgress.filter(Boolean).length;
        const winRate = trades.length ? ((trades.filter(t=>t.pnl>0).length / trades.length) * 100).toFixed(1) : 0;
        const totalPnL = trades.reduce((s,t) => s + (parseFloat(t.pnl) || 0), 0);
        const discipline = userStats.discipline || 70;
        const riskControl = userStats.riskControl || 70;
        
        return `
            <div class="space-y-6 max-w-7xl mx-auto">
                <!-- Welcome Header -->
                <div class="glass-card p-6 lg:p-8">
                    <h2 class="text-3xl lg:text-4xl font-display font-bold neon-text mb-2">
                        Namaste Trader! 🙏
                    </h2>
                    <p class="text-gray-400 font-display text-lg">
                        Aaj ka focus: Discipline + Risk Control = Consistent Profit
                    </p>
                </div>
                
                <!-- Stats Grid -->
                <div class="grid grid-cols-2 lg:grid-cols-4 gap-3 lg:gap-4">
                    <div class="glass-panel p-4 lg:p-6 stat-card">
                        <div class="text-xs lg:text-sm text-gray-400 mb-1 font-display">🎯 Discipline</div>
                        <div class="text-2xl lg:text-3xl font-bold font-mono neon-text">${discipline}%</div>
                        <div class="w-full bg-gray-700 rounded-full h-1.5 mt-2">
                            <div class="progress-glow h-full" style="width: ${discipline}%"></div>
                        </div>
                    </div>
                    
                    <div class="glass-panel p-4 lg:p-6 stat-card">
                        <div class="text-xs lg:text-sm text-gray-400 mb-1 font-display">🛡️ Risk Control</div>
                        <div class="text-2xl lg:text-3xl font-bold font-mono neon-text">${riskControl}%</div>
                        <div class="w-full bg-gray-700 rounded-full h-1.5 mt-2">
                            <div class="progress-glow h-full" style="width: ${riskControl}%"></div>
                        </div>
                    </div>
                    
                    <div class="glass-panel p-4 lg:p-6 stat-card">
                        <div class="text-xs lg:text-sm text-gray-400 mb-1 font-display">📈 Win Rate</div>
                        <div class="text-2xl lg:text-3xl font-bold font-mono ${winRate >= 50 ? 'text-green-400' : 'text-yellow-400'}">${winRate}%</div>
                        <div class="text-xs text-gray-500 mt-1">${trades.length} trades</div>
                    </div>
                    
                    <div class="glass-panel p-4 lg:p-6 stat-card">
                        <div class="text-xs lg:text-sm text-gray-400 mb-1 font-display">💰 Total P&L</div>
                        <div class="text-xl lg:text-2xl font-bold font-mono ${totalPnL >= 0 ? 'text-green-400' : 'text-red-400'}">
                            ${totalPnL >= 0 ? '+' : ''}₹${totalPnL.toFixed(2)}
                        </div>
                        <div class="text-xs text-gray-500 mt-1">
                            ${totalPnL >= 0 ? 'Profit mode 🚀' : 'Stay disciplined 💪'}
                        </div>
                    </div>
                </div>
                
                <!-- 30-Day Progress -->
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xl font-display font-bold">30-Day Learning Progress</h3>
                        <span class="text-sm font-mono text-cyan-400">${completed}/30 Complete</span>
                    </div>
                    <div class="w-full bg-gray-700 rounded-full h-3 mb-4">
                        <div class="progress-glow h-full rounded-full" style="width: ${(completed/30)*100}%"></div>
                    </div>
                    <div class="grid grid-cols-10 gap-2">
                        ${dailyProgress.map((d, i) => `
                            <button data-dayidx="${i}" class="toggle-day day-progress-item ${d ? 'completed' : 'incomplete'}">
                                ${i+1}
                            </button>
                        `).join('')}
                    </div>
                </div>
                
                <!-- Quick Actions -->
                <div class="grid md:grid-cols-2 gap-4">
                    <div class="glass-card p-6">
                        <h3 class="text-lg font-display font-bold mb-3 text-cyan-400">🎯 Today's Checklist</h3>
                        <div class="space-y-2">
                            <label class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/5 cursor-pointer transition-colors">
                                <input type="checkbox" class="w-5 h-5 rounded border-cyan-500 text-cyan-600">
                                <span class="text-sm">Aaj ka lesson complete kiya?</span>
                            </label>
                            <label class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/5 cursor-pointer transition-colors">
                                <input type="checkbox" class="w-5 h-5 rounded border-cyan-500 text-cyan-600">
                                <span class="text-sm">Trading plan review kiya?</span>
                            </label>
                            <label class="flex items-center gap-3 p-3 rounded-lg hover:bg-white/5 cursor-pointer transition-colors">
                                <input type="checkbox" class="w-5 h-5 rounded border-cyan-500 text-cyan-600">
                                <span class="text-sm">Journal update kiya?</span>
                            </label>
                        </div>
                    </div>
                    
                    <div class="glass-card p-6">
                        <h3 class="text-lg font-display font-bold mb-3 text-green-400">💡 Today's Motivation</h3>
                        <div class="space-y-3">
                            <p class="italic text-cyan-300 text-sm lg:text-base">
                                "Risk define karo, rules follow karo, profit automatically aayega"
                            </p>
                            <div class="bg-yellow-500/10 border border-yellow-500/30 rounded-lg p-3">
                                <p class="text-xs lg:text-sm text-yellow-300">
                                    ⚠️ Remember: 2% Rule is LAW. Kabhi break mat karo.
                                </p>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Recent Trades Preview -->
                ${trades.length > 0 ? `
                <div class="glass-card p-6">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-lg font-display font-bold">Recent Trades</h3>
                        <button data-tab="journal" class="text-sm text-cyan-400 hover:text-cyan-300">View All →</button>
                    </div>
                    <div class="space-y-2">
                        ${trades.slice(0, 3).map(t => `
                            <div class="glass-panel p-3 flex justify-between items-center">
                                <div>
                                    <span class="font-mono text-cyan-400">${t.pair || 'N/A'}</span>
                                    <span class="text-xs text-gray-500 ml-2">${t.date || ''}</span>
                                </div>
                                <div class="text-right">
                                    <div class="font-mono font-bold ${(t.pnl || 0) >= 0 ? 'text-green-400' : 'text-red-400'}">
                                        ${(t.pnl || 0) >= 0 ? '+' : ''}₹${(t.pnl || 0).toFixed(2)}
                                    </div>
                                    <div class="text-xs text-gray-500">${t.emotion || 'Neutral'}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
                ` : ''}
            </div>
        `;
    }
    
    // ==================== ROADMAP HTML ====================
    function roadmapHTML() {
        const roadmapData = [
            { title: "Market Basics & Structure", days: [1, 2, 3] },
            { title: "SMC Core Concepts", days: [4, 5, 6, 7, 8] },
            { title: "Risk Management", days: [9, 10, 11, 12, 13, 14, 15] },
            { title: "Psychology & Discipline", days: [16, 17, 18, 19, 20] },
            { title: "Execution & Practice", days: [21, 22, 23, 24, 25] },
            { title: "Advanced Strategies", days: [26, 27, 28, 29, 30] }
        ];
        
        return `
            <div class="space-y-6 max-w-4xl mx-auto">
                <div class="glass-card p-6">
                    <h2 class="text-3xl font-display font-bold neon-text mb-2">30-Day Learning Roadmap</h2>
                    <p class="text-gray-400">Structured path to becoming a disciplined trader</p>
                </div>
                
                ${roadmapData.map((section, sIdx) => `
                    <div class="glass-card p-6">
                        <h3 class="text-xl font-display font-bold mb-4 text-cyan-400">
                            Week ${sIdx + 1}: ${section.title}
                        </h3>
                        <div class="space-y-2">
                            ${section.days.map(day => {
                                const dayIdx = day - 1;
                                const isCompleted = dailyProgress[dayIdx];
                                return `
                                    <div class="glass-panel p-4 flex justify-between items-center">
                                        <div class="flex-1">
                                            <div class="font-display font-semibold text-cyan-300">Day ${day}</div>
                                            <div class="text-sm text-gray-400 mt-1">
                                                ${getDayContent(day)}
                                            </div>
                                        </div>
                                        <button data-dayidx="${dayIdx}" class="toggle-day px-4 py-2 rounded-lg font-display font-medium transition-all ${
                                            isCompleted 
                                            ? 'bg-green-600 text-white' 
                                            : 'bg-gray-700 hover:bg-gray-600 text-gray-300'
                                        }">
                                            ${isCompleted ? '✅ Done' : 'Mark Complete'}
                                        </button>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `).join('')}
                
                <div class="glass-panel p-6">
                    <h4 class="font-display font-bold mb-2 text-yellow-400">📹 Video Resources</h4>
                    <p class="text-sm text-gray-400">
                        Each day includes YouTube tutorials, Hinglish notes, and practice exercises.
                        All progress syncs with Firebase in real-time.
                    </p>
                </div>
            </div>
        `;
    }

        const content = {

            5: "BOS & CHoCH understanding",
            6: "Liquidity pools & stop hunts",

            8: "Fair Value Gaps (FVG)",

            14: "Money management rules",
            15: "Risk management practice",
            16: "Trading psychology basics",
            17: "Emotion control techniques",
            18: "Discipline building",
            19: "Handling losses",

            21: "Entry execution tactics",
            22: "Exit strategy planning",

    // ==================== EVENT HANDLERS ====================
    function attachEvents() {
        // Day progress toggle
        document.querySelectorAll('.toggle-day').forEach(btn => {
            btn.onclick = async (e) => {
                e.preventDefault();
                const idx = parseInt(btn.dataset.dayidx);
                dailyProgress[idx] = !dailyProgress[idx];
                await window.updateProgress(idx, dailyProgress[idx]);
                localStorage.setItem('tm_progress', JSON.stringify(dailyProgress));
                loadData();
            };
        });
        
        // Save journal
        document.getElementById('saveJournal')?.addEventListener('click', async () => {
            const pair = document.getElementById('jPair').value;
            const entry = document.getElementById('jEntry').value;
            const exit = document.getElementById('jExit').value;
            const pnl = document.getElementById('jPnL').value;
            const emotion = document.getElementById('jEmotion').value;
            const mistake = document.getElementById('jMistake').value;
            const date = document.getElementById('jDate').value;
            
            if(!pair || !pnl) {
                showToast('Pair aur P&L fill karo', 'error');
                return;
            }
            
            const trade = {
                pair,
                entry: parseFloat(entry) || 0,
                exit: parseFloat(exit) || 0,
                pnl: parseFloat(pnl),
                emotion,
                mistake,
                date
            };
            
            await window.addTrade(trade);
            await window.loadAllUserData(window.auth.currentUser.uid);
        });
        
        // Calculator real-time calculation
        const calculatePosition = () => {
            const bal = parseFloat(document.getElementById('calcBal')?.value) || 0;
            const risk = parseFloat(document.getElementById('calcRisk')?.value) || 0;
            const entry = parseFloat(document.getElementById('calcEntry')?.value) || 0;
            const sl = parseFloat(document.getElementById('calcSL')?.value) || 0;
            const rr = parseFloat(document.getElementById('calcRR')?.value) || 2;
            
            const riskAmt = (bal * risk) / 100;
            const stopDist = Math.abs(entry - sl);
            const posSize = stopDist ? riskAmt / stopDist : 0;
            const potentialProfit = posSize * stopDist * rr;
            const tp = entry > sl ? entry + (stopDist * rr) : entry - (stopDist * rr);
            
            document.getElementById('calcResult').innerHTML = `
                <div class="space-y-2">
                    <div class="flex justify-between border-b border-gray-700 pb-2">
                        <span class="text-gray-400">Risk Amount:</span>
                        <span class="font-mono font-bold text-red-400">₹${riskAmt.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-2">
                        <span class="text-gray-400">Position Size:</span>
                        <span class="font-mono font-bold text-cyan-400">${posSize.toFixed(4)} units</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-2">
                        <span class="text-gray-400">Stop Distance:</span>
                        <span class="font-mono font-bold">${stopDist.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between border-b border-gray-700 pb-2">
                        <span class="text-gray-400">Take Profit:</span>
                        <span class="font-mono font-bold text-green-400">${tp.toFixed(2)}</span>
                    </div>
                    <div class="flex justify-between pt-2">
                        <span class="text-gray-400">Potential Profit (1:${rr}):</span>
                        <span class="font-mono font-bold text-green-400">₹${potentialProfit.toFixed(2)}</span>
                    </div>
                </div>
            `;
        };
        
        ['calcBal', 'calcRisk', 'calcEntry', 'calcSL', 'calcRR'].forEach(id => {
            document.getElementById(id)?.addEventListener('input', calculatePosition);
        });
        calculatePosition();
        
        // TradingView refresh
        document.getElementById('refreshChart')?.addEventListener('click', () => {
            initTradingView();
        });
        
        // Execution confidence meter
        document.querySelectorAll('.conf-btn').forEach(btn => {
            btn.onclick = () => {
                document.querySelectorAll('.conf-btn').forEach(b => {
                    b.classList.remove('bg-cyan-600');
                    b.classList.add('bg-gray-700');
                });
                btn.classList.remove('bg-gray-700');
                btn.classList.add('bg-cyan-600');
            };
        });
        
        // Execute trade button
        document.getElementById('takeTradeExec')?.addEventListener('click', () => {
            showToast('🚀 Trade executed! Journal me update karna mat bhoolna.', 'success');
        });
    }
    
    // ==================== TRADINGVIEW INIT ====================
    function initTradingView() {
        const container = document.getElementById('tradingview_chart');
        if(!container) return;
        
        const symbol = document.getElementById('tvSymbol')?.value || 'BINANCE:BTCUSDT';
        const interval = document.getElementById('tvInterval')?.value || '60';
        const theme = document.documentElement.classList.contains('light') ? 'light' : 'dark';
        
        container.innerHTML = '';
        
        if(window.TradingView) {
            tvWidget = new TradingView.widget({
                container_id: "tradingview_chart",
                symbol: symbol,
                interval: interval,
                theme: theme,
                style: "1",
                locale: "en",
                toolbar_bg: theme === 'dark' ? '#0a0e1a' : '#f1f3f6',
                enable_publishing: false,
                hide_side_toolbar: false,
                allow_symbol_change: true,
                width: "100%",
                height: 500
            });
        } else {
            container.innerHTML = '<div class="flex items-center justify-center h-full text-gray-400">TradingView loading...</div>';
        }
    }
    
    // ==================== ANALYTICS CHARTS ====================
    function initAnalyticsCharts() {
        // P&L Chart
        const pnlCanvas = document.getElementById('pnlChart');
        if(pnlCanvas && window.Chart) {
            const ctx = pnlCanvas.getContext('2d');
            const sortedTrades = [...trades].sort((a, b) => new Date(a.date) - new Date(b.date));
            let cumulative = 0;
            const cumulativeData = sortedTrades.map(t => {
                cumulative += parseFloat(t.pnl) || 0;
                return cumulative;
            });
            
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: sortedTrades.map((_, i) => `T${i+1}`),
                    datasets: [{
                        label: 'Cumulative P&L',
                        data: cumulativeData,
                        borderColor: '#00ffff',
                        backgroundColor: 'rgba(0, 255, 255, 0.1)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        y: {
                            ticks: { color: '#a0aec0' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        },
                        x: {
                            ticks: { color: '#a0aec0' },
                            grid: { color: 'rgba(255, 255, 255, 0.05)' }
                        }
                    }
                }
            });
        }
        
        // Win/Loss Chart
        const winLossCanvas = document.getElementById('winLossChart');
        if(winLossCanvas && window.Chart) {
            const ctx = winLossCanvas.getContext('2d');
            const wins = trades.filter(t => t.pnl > 0).length;
            const losses = trades.filter(t => t.pnl < 0).length;
            
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Wins', 'Losses'],
                    datasets: [{
                        data: [wins, losses],
                        backgroundColor: ['#00ff88', '#ff0080'],
                        borderWidth: 0
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: {
                            position: 'bottom',
                            labels: { color: '#a0aec0' }
                        }
                    }
                }
            });
        }
    }
    
    // ==================== HELPER FUNCTIONS ====================
    function getMostTradedPair() {
        if(trades.length === 0) return 'N/A';
        const pairs = {};
        trades.forEach(t => {
            pairs[t.pair] = (pairs[t.pair] || 0) + 1;
        });
        return Object.entries(pairs).sort((a, b) => b[1] - a[1])[0][0];
    }
    
    function getBestEmotion() {
        if(trades.length === 0) return 'N/A';
        const emotions = {};
        trades.forEach(t => {
            if(!emotions[t.emotion]) emotions[t.emotion] = { count: 0, totalPnL: 0 };
            emotions[t.emotion].count++;
            emotions[t.emotion].totalPnL += parseFloat(t.pnl) || 0;
        });
        const best = Object.entries(emotions)
            .map(([emotion, data]) => ({ emotion, avgPnL: data.totalPnL / data.count }))
            .sort((a, b) => b.avgPnL - a.avgPnL)[0];
        return best ? best.emotion : 'N/A';
    }
    
    // ==================== EVENT LISTENERS ====================
    window.addEventListener('dataLoaded', () => {
        loadData();
    });
    
    document.querySelectorAll('.nav-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            activeTab = btn.dataset.tab;
            render();
        });
    });
    
    document.querySelectorAll('.mobile-nav-item').forEach(btn => {
        btn.addEventListener('click', () => {
            activeTab = btn.dataset.tab;
            render();
        });
    });
    
    // ==================== INIT ====================
    loadData();
</script>
